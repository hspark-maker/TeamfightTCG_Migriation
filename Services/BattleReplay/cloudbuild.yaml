steps:
  # 규칙 회귀 게이트. 골든 21벡터를 BattleCore 로 재생해 finalStateHash 를 대조한다(현재 19 pass / 1 skip).
  # 이미지보다 **먼저** 돌려서, 규칙이 갈리면 배포 가능한 이미지가 아예 안 만들어지게 한다.
  # 로컬은 .NET SDK 가 없어 csc 로만 돌릴 수 있으므로 여기가 유일한 정규 실행 지점이다.
  - name: mcr.microsoft.com/dotnet/sdk:8.0
    id: golden
    entrypoint: dotnet
    args:
      - run
      - --project
      - Tools/BattleCoreGolden/TeamfightTCG.BattleCoreGolden.csproj
      - --configuration
      - Release
      - --
      - /workspace

  - name: gcr.io/cloud-builders/docker
    waitFor: [golden]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - Services/BattleReplay/Dockerfile
      - --tag
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
      - .
images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
substitutions:
  _TAG: manual
