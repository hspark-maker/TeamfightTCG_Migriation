steps:
  - name: gcr.io/cloud-builders/docker
    id: image
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - Services/BattleReplay/Dockerfile
      - --tag
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
      - .

  # 배포 전 푸시. **없으면 배포가 실패한다** — 맨 아래 images: 는 모든 스텝이 끝난 뒤에 푸시하는데
  # Cloud Run 은 레지스트리에서 이미지를 당기므로, 그 시점엔 태그가 없어
  # `Image '...:<tag>' not found` 로 떨어진다(로컬 docker 데몬에만 있는 상태다).
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [image]
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}

  # 선택 배포. 기본은 꺼져 있다 — `--substitutions=_DEPLOY=true` 로만 돈다.
  #
  # 이 스텝을 쓰려면 Cloud Build 서비스계정에 roles/run.admin 과
  # roles/iam.serviceAccountUser(런타임 SA 대상)가 있어야 한다. 없으면 여기서만 실패하고
  # 이미지는 이미 만들어진 상태로 남는다 — 수동 배포로 이어갈 수 있다.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "deploy skipped (_DEPLOY=${_DEPLOY})"; exit 0
        fi
        gcloud run deploy "${_SERVICE}" \
          --image "asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}" \
          --region "${_REGION}" \
          --no-allow-unauthenticated \
          --scaling=auto \
          --min=0 \
          --min-instances=0 \
          --cpu-throttling \
          --set-env-vars "FIRESTORE_DATABASE_ID=cardbattle"

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
substitutions:
  _TAG: manual
  _DEPLOY: "false"
  _SERVICE: battle-replay
  _REGION: asia-northeast3
