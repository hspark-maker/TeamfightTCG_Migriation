steps:
  # 규칙 회귀 게이트. 골든 21벡터를 BattleCore 로 재생해 finalStateHash 를 대조한다(현재 19 pass / 1 skip).
  # 이미지보다 **먼저** 돌려서, 규칙이 갈리면 배포 가능한 이미지가 아예 안 만들어지게 한다.
  # 로컬은 .NET SDK 가 없어 csc 로만 돌릴 수 있으므로 여기가 유일한 정규 실행 지점이다.
  - name: mcr.microsoft.com/dotnet/sdk:8.0
    id: golden
    entrypoint: dotnet
    args:
      - run
      - --project
      - Tools/BattleCoreGolden/TeamfightTCG.BattleCoreGolden.csproj
      - --configuration
      - Release
      - --
      - /workspace

  - name: gcr.io/cloud-builders/docker
    id: image
    waitFor: [golden]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - Services/BattleReplay/Dockerfile
      - --tag
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
      - .

  # 선택 배포. 기본은 꺼져 있다 — `--substitutions=_DEPLOY=true` 로만 돈다.
  # 이미지 푸시는 아래 images: 가 이 스텝들보다 뒤에 일어나므로, 여기서는 방금 빌드한
  # 태그를 그대로 지정한다(같은 다이제스트를 Cloud Run 이 레지스트리에서 당긴다).
  #
  # 이 스텝을 쓰려면 Cloud Build 서비스계정에 roles/run.admin 과
  # roles/iam.serviceAccountUser(런타임 SA 대상)가 있어야 한다. 없으면 여기서만 실패하고
  # 이미지는 이미 만들어진 상태로 남는다 — 수동 배포로 이어갈 수 있다.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "deploy skipped (_DEPLOY=${_DEPLOY})"; exit 0
        fi
        gcloud run deploy "${_SERVICE}" \
          --image "asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}" \
          --region "${_REGION}" \
          --no-allow-unauthenticated \
          --min-instances=1 \
          --set-env-vars "FIRESTORE_DATABASE_ID=cardbattle"

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/backend/battle-replay:${_TAG}
substitutions:
  _TAG: manual
  _DEPLOY: "false"
  _SERVICE: battle-replay
  _REGION: asia-northeast3
